services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: 
      - ./frontend/.env
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "3500:3500"
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
